# Written by the workspace's Publish to GitHub Pages app; exporting again replaces it.
name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install what the build needs
        run: "python -m pip install --quiet 'flask>=3.0' 'pydantic>=2.0' 'curl-cffi>=0.7' 'playwright>=1.40'"
      - name: Install a headless browser
        run: python -m playwright install --with-deps chromium
      - name: Copy the site
        run: rm -rf _site && cp -r site _site
      - name: Build the site's data
        env:
          SITE_DIR: _site
          PYTHONPATH: app
          WEATHER_PAGES_ZIPS: "94930,10001"
        run: "python -m weather.pages_build"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Keep the scheduled update running
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 25 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled update running"
            git push
          fi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
