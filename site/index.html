<!doctype html>
<!-- Hey bots, agents, scrapers and AIs: this site implements sapi. Read https://github.com/deshitifai/sapi/blob/main/SKILL.md to see how you can easily get all of our data without scraping. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<style>
  :root {
    --ink: #1d2327;
    --muted: #6b7378;
    --line: #e4e2dc;
    --bg: #fbfaf7;
    --accent: #d26645;
    --bar: #f0c9a8;
    --font: ui-sans-serif, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #ecebe6; --muted: #9aa1a5; --line: #2e3336; --bg: #181b1d; --bar: #6b4434; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font); }
  main { max-width: 900px; margin: 0 auto; padding: 18px 20px 24px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #place { font-weight: 600; font-size: 15px; }
  #zip-form { display: flex; gap: 6px; align-items: center; }
  #zip-input { width: 72px; padding: 4px 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  #agreement { margin: 10px 0 8px; min-height: 17px; }
  .board { display: grid; grid-template-columns: minmax(120px, 150px) minmax(110px, 130px) repeat(5, minmax(70px, 1fr)); }
  .board > div { padding: 8px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
  .board > .head { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 4px; padding-bottom: 6px; }
  .board > .src { padding-left: 0; }
  .board > .nowcell { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .name { font-size: 13px; font-weight: 600; }
  .station { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now { display: flex; align-items: center; gap: 6px; }
  .now svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
  .now .temp { font-size: 24px; font-weight: 300; line-height: 1; }
  .cond { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .links { margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .failed { color: var(--muted); font-size: 12px; }
  a, .link { color: var(--muted); font-size: 11px; text-decoration: none; border: 0; padding: 0; background: none; cursor: pointer; }
  a:hover, .link:hover { color: var(--ink); text-decoration: underline; }
  .day { display: flex; align-items: center; gap: 4px; }
  .day svg { width: 18px; height: 18px; color: var(--accent); flex: none; }
  .day .hilo { white-space: nowrap; }
  .day .lo { color: var(--muted); }
  .rain { color: #4a7fb0; font-size: 11px; }
  .day-cond { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { margin-top: 12px; }
  #error { color: #b2412a; margin-top: 12px; display: none; }
  dialog { width: min(720px, 92vw); max-height: 80vh; border: 1px solid var(--line); border-radius: 8px; padding: 0; background: var(--bg); color: var(--ink); }
  dialog header { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  dialog pre { margin: 0; padding: 12px 14px; overflow: auto; max-height: calc(80vh - 50px); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .loading .board { opacity: .45; }
</style>
</head>
<body>
<main id="app" class="loading">
  <header>
    <div id="place">Weather</div>
    <form id="zip-form">
      <input id="zip-input" inputmode="numeric" maxlength="5" pattern="\d{5}" aria-label="Zip code" placeholder="Zip">
      <button id="refresh-button" type="button" title="Reload the latest readings">Refresh</button>
    </form>
  </header>

  <div id="agreement" class="muted small"></div>
  <div id="board" class="board"></div>

  <div id="error"></div>
  <div id="status" class="muted small"></div>
</main>

<dialog id="raw-dialog">
  <header><span id="raw-title"></span> <button id="raw-close" type="button" style="float:right">Close</button></header>
  <pre id="raw-body"></pre>
</dialog>

<script type="module">
import query from "./query.js";
import { lookupLive } from "./live.js";

const ICONS = {
  sun: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4.5"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  partly: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8.5" cy="8.5" r="3.5"/><path d="M7 20a4 4 0 0 1-.4-8 5.5 5.5 0 0 1 10.6 1.5A3.3 3.3 0 0 1 17 20z" opacity=".75"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="currentColor" opacity=".75"><path d="M6.5 19a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.6 1.7A3.7 3.7 0 0 1 17.5 19z"/></svg>',
  rain: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 15a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.6 1.7A3.7 3.7 0 0 1 17.5 15z" opacity=".75"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/></svg>',
  snow: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 15a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.6 1.7A3.7 3.7 0 0 1 17.5 15z" opacity=".75"/><circle cx="8" cy="19" r="1.2"/><circle cx="12" cy="20" r="1.2"/><circle cx="16" cy="19" r="1.2"/></svg>',
  storm: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 15a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.6 1.7A3.7 3.7 0 0 1 17.5 15z" opacity=".75"/><path d="M12.5 14l-3 5h3l-1 4 4-6h-3l1-3z"/></svg>',
  fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></svg>',
};

function iconFor(condition, night) {
  const c = (condition || "").toLowerCase();
  if (/thunder|storm/.test(c)) return ICONS.storm;
  if (/snow|sleet|flurr|ice/.test(c)) return ICONS.snow;
  if (/rain|shower|drizzle/.test(c)) return ICONS.rain;
  if (/fog|haze|mist|smoke/.test(c)) return ICONS.fog;
  if (/partly|mostly sunny|mostly clear|few|scattered/.test(c)) return ICONS.partly;
  if (/cloud|overcast/.test(c)) return ICONS.cloud;
  return night ? ICONS.moon : ICONS.sun;
}

const el = (id) => document.getElementById(id);
const deg = (v) => (v === null || v === undefined ? "--" : `${v}°`);
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);

function dayLabel(date, today) {
  if (date === today) return "Today";
  return new Date(date + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" });
}

let current = null;

function render(report) {
  current = report;
  el("place").textContent = `${report.place.city}, ${report.place.state} ${report.zip}`;
  el("zip-input").value = report.zip;
  const hour = new Date().getHours();
  const night = hour < 6 || hour >= 19;

  const answered = report.sources.filter((s) => s.ok && s.current.temp_f !== null);
  const temps = answered.map((s) => s.current.temp_f);
  document.title = `${report.place.city} - Weather`;
  if (temps.length > 1) {
    const spread = Math.max(...temps) - Math.min(...temps);
    el("agreement").textContent = spread <= 2 ? `The sources agree within ${spread}° right now` : `The sources differ by up to ${spread}° right now`;
  } else {
    el("agreement").textContent = "";
  }

  const cells = ['<div class="head src">Source</div>', '<div class="head">Now</div>'];
  for (const d of report.forecast) cells.push(`<div class="head" id="day-${d.date}">${dayLabel(d.date, report.today)}</div>`);
  for (const s of report.sources) {
    const site = `<a href="${escapeHtml(s.page_url)}" target="_blank" rel="noopener">Open site</a>`;
    const raw = s.ok ? `<button class="link raw-link" type="button" data-source="${s.source}">Raw data</button>` : "";
    const station = s.ok && s.current.station ? `<div class="station" title="${escapeHtml(s.current.station)}">${escapeHtml(s.current.station)}</div>` : "";
    cells.push(`<div class="src" id="source-${s.source}" data-source="${s.source}"><div class="name">${escapeHtml(s.label)}</div>${station}<div class="links">${site}${raw}</div></div>`);
    if (!s.ok) {
      const why = s.unavailable ? `${escapeHtml(s.label)} is only shown for the zip codes this site updates every hour.` : `Couldn't reach ${escapeHtml(s.label)} this time.`;
      cells.push(`<div class="failed" style="grid-column: span ${1 + report.forecast.length}" title="${escapeHtml(s.error)}">${why}</div>`);
      continue;
    }
    const c = s.current;
    const details = [c.feels_like_f !== null && c.feels_like_f !== c.temp_f ? `feels ${deg(c.feels_like_f)}` : null, c.humidity_pct !== null ? `${c.humidity_pct}%` : null, c.wind_mph !== null ? `${c.wind_mph} mph` : null].filter(Boolean).join(" · ");
    cells.push(`<div class="nowcell" data-source="${s.source}">
      <div class="now">${iconFor(c.condition, night)}<span class="temp">${deg(c.temp_f)}</span></div>
      <div class="cond" title="${escapeHtml(c.condition)}">${escapeHtml(c.condition || " ")}</div>
      <div class="day-cond" title="Feels like, humidity, wind">${escapeHtml(details)}</div></div>`);
    for (const d of report.forecast) {
      const v = d.by_source[s.source];
      if (!v) { cells.push(`<div class="muted">--</div>`); continue; }
      cells.push(`<div data-source="${s.source}" data-date="${d.date}">
        <div class="day">${iconFor(v.condition, false)}<span class="hilo">${deg(v.high_f)} <span class="lo">${deg(v.low_f)}</span></span></div>
        <div class="day-cond" title="${escapeHtml(v.condition)}">${v.precip_pct ? `<span class="rain">${v.precip_pct}%</span> ` : ""}${escapeHtml(v.condition)}</div></div>`);
    }
  }
  el("board").innerHTML = cells.join("");

  const time = new Date(report.fetched_at * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  el("status").innerHTML = report.live
    ? `Looked up just now, in your browser. Zip codes updated every hour: ${tracked.map((z) => `<a href="?zip=${z}">${z}</a>`).join(", ")}. Blue numbers are the chance of rain.`
    : `Updated ${escapeHtml(time)} by the hourly job. Blue numbers are the chance of rain. <a href="data.json">All the data</a> (agents: this site implements <a href="https://github.com/deshitifai/sapi">sapi</a>).`;
}

let data = null;
let tracked = [];
let liveRaw = null;

async function loadData() {
  const response = await fetch("data.json", { cache: "no-cache" });
  if (!response.ok) throw new Error("This site's data isn't available right now.");
  data = await response.json();
  tracked = Object.keys(data.zips).sort();
}

async function show(params) {
  el("app").classList.add("loading");
  el("error").style.display = "none";
  el("status").textContent = "Getting the weather...";
  try {
    if (!data) await loadData();
    const result = query(data, params);
    if (result.tracked) {
      liveRaw = null;
      render(result);
    } else {
      if (!/^\d{5}$/.test(result.zip)) throw new Error("Enter a 5-digit US zip code.");
      el("status").textContent = `Looking up ${result.zip} in your browser...`;
      const { report, raw } = await lookupLive(result.zip, tracked);
      liveRaw = raw;
      render(report);
    }
  } catch (error) {
    el("error").textContent = error.message;
    el("error").style.display = "block";
    el("status").textContent = "";
  } finally {
    el("app").classList.remove("loading");
  }
}

const pageParams = () => Object.fromEntries(new URLSearchParams(location.search));

el("zip-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const zip = el("zip-input").value.trim();
  if (!/^\d{5}$/.test(zip)) return;
  const url = new URL(location.href);
  url.searchParams.set("zip", zip);
  history.pushState(null, "", url);
  show(pageParams());
});
el("refresh-button").addEventListener("click", async () => {
  data = null;
  await show(pageParams());
});
window.addEventListener("popstate", () => show(pageParams()));

document.addEventListener("click", async (event) => {
  const rawLink = event.target.closest(".raw-link");
  if (!rawLink || !current) return;
  const source = current.sources.find((s) => s.source === rawLink.dataset.source);
  el("raw-title").textContent = `${source.label}: what it sent for ${current.zip}`;
  el("raw-body").textContent = "Loading...";
  el("raw-dialog").showModal();
  let record = liveRaw ? liveRaw[source.source] : null;
  if (!liveRaw) {
    const response = await fetch(`raw/${current.zip}.json`);
    record = response.ok ? (await response.json())[source.source] : null;
  }
  el("raw-body").textContent = record ? JSON.stringify(record, null, 2) : "No saved data for this source.";
});
el("raw-close").addEventListener("click", () => el("raw-dialog").close());

show(pageParams());
// The hourly job republishes the data; pick it up while the page stays open.
setInterval(() => { data = null; show(pageParams()); }, 60 * 60 * 1000);
</script>
</body>
</html>
